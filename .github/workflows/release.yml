name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci-passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 2
      - name: Check CI status on tagged commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '.workflow_runs[0].conclusion // "none"' 2>/dev/null || echo "unknown")
          echo "CI conclusion for ${GITHUB_SHA:0:7}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            diff_files=$(git diff --name-only HEAD~1 HEAD || true)
            if [ "$diff_files" = ".github/workflows/release.yml" ]; then
              parent_sha=$(git rev-parse HEAD~1)
              conclusion=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${parent_sha}&status=completed" \
                --jq '.workflow_runs[0].conclusion // "none"' 2>/dev/null || echo "unknown")
              echo "Release-workflow-only commit; parent ${parent_sha:0:7} CI conclusion: ${conclusion}"
            fi
          fi
          if [ "$conclusion" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: verify-ci
    if: needs.verify-ci.outputs.ci-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-opt3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-opt3-
      - name: Install dumpcap for V21 loopback wire census
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark libcap2-bin
          sudo chmod 0755 "$(command -v dumpcap)"
          sudo setcap cap_net_raw,cap_net_admin=eip "$(command -v dumpcap)"
      - name: Run cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace verification suite
        env:
          FIELDSMITH_SMALL_RAM: "1"
          FIELDSMITH_COSTS_STORE: /dev/null
        run: cargo test --workspace -- --test-threads=1

  build-cli:
    needs: [verify-ci, test]
    if: |
      !cancelled() &&
      (needs.verify-ci.outputs.ci-passed == 'true' || needs.test.result == 'success')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/${{ matrix.target }}/
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.target }}-
      - name: Install musl toolchain (${{ matrix.target }})
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add ${{ matrix.target }}
      - name: Build release CLI and MCP binaries (${{ matrix.target }})
        run: |
          cargo build --release --target ${{ matrix.target }} -p fieldsmith-cli -p fieldsmith-mcp
          tag="${GITHUB_REF_NAME}"
          stage="fieldsmith-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/fieldsmith" "dist/${stage}/"
          cp "target/${{ matrix.target }}/release/fieldsmith-mcp" "dist/${stage}/"
          cp LICENSE README.md VISION.md "dist/${stage}/"
          cp -r examples data "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
      - name: Upload CLI archive (${{ matrix.target }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fieldsmith-${{ matrix.target }}
          path: dist/fieldsmith-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-web:
    needs: [verify-ci, test]
    if: |
      !cancelled() &&
      (needs.verify-ci.outputs.ci-passed == 'true' || needs.test.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.npm
            target/wasm32-unknown-unknown/
            target/wasm-mt/
          key: ${{ runner.os }}-web-${{ hashFiles('**/Cargo.lock', 'web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-web-
      - name: Install pinned toolchains (Rust 1.97.1, wasm-bindgen 0.2.129, cargo-ndk 3.5.4)
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add wasm32-unknown-unknown aarch64-linux-android
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
          cargo install cargo-ndk@3.5.4 --locked
          cargo install wasm-bindgen-cli@0.2.129 --locked
      - name: Build esbuild v0.28.2 and rollup v4.64.0 from source (F-Droid reproducible recipe)
        run: |
          git clone --depth 1 --branch v0.28.2 https://github.com/evanw/esbuild.git /tmp/esbuild-src
          (cd /tmp/esbuild-src && go build ./cmd/esbuild)
          git clone --depth 1 --branch v4.64.0 https://github.com/rollup/rollup.git /tmp/rollup-src
          (cd /tmp/rollup-src && npm install --no-save --no-audit --no-fund @napi-rs/cli@3.4.1 \
            && ./node_modules/.bin/napi build --cwd rust/bindings_napi --platform --release \
               --no-js --dts native.d.ts --output-dir ../.. --package-json-path ../../package.json)
      - name: Build web bundle (threaded wasm, for the standalone web archive)
        run: |
          npm --prefix web ci --ignore-scripts
          rm -f web/node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node
          cp -f /tmp/rollup-src/rollup.linux-x64-gnu.node web/node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node
          bash scripts/build-wasm.sh
          npm --prefix web run typecheck
          ESBUILD_BINARY_PATH=/tmp/esbuild-src/esbuild npm --prefix web run build
          tag="${GITHUB_REF_NAME}"
          stage="fieldsmith-${tag}-web"
          mkdir -p "dist/${stage}"
          cp -r web/dist/* "dist/${stage}/"
          cp LICENSE README.md "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
      - name: Build signed Android APK (arm64-v8a, single-thread wasm to match F-Droid)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          rm -rf web/src/pkg-mt
          FIELDSMITH_WASM_ST_ONLY=1 bash scripts/build-wasm.sh
          ESBUILD_BINARY_PATH=/tmp/esbuild-src/esbuild npm --prefix web run build
          echo "y" | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" "build-tools;35.0.0"
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/29.0.14206865" cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p fieldsmith-mcp
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          (cd android && ./gradlew --no-daemon assembleArm64Release)
          tag="${GITHUB_REF_NAME}"
          unsigned_apk="android/app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk"
          aligned_apk="android/app/build/outputs/apk/arm64/release/app-arm64-release-aligned.apk"
          out_apk="dist/fieldsmith-${tag}-arm64-v8a.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -f 4 "${unsigned_apk}" "${aligned_apk}"
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > /tmp/fieldsmith-release.jks
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
              --ks /tmp/fieldsmith-release.jks \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass env:KEY_PASSWORD \
              --alignment-preserved \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "${out_apk}" \
              "${aligned_apk}"
            rm -f /tmp/fieldsmith-release.jks
          else
            cp "${aligned_apk}" "${out_apk}"
          fi
      - name: Upload web archive and Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fieldsmith-web
          path: |
            dist/fieldsmith-*-web.tar.gz
            dist/fieldsmith-*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build-cli, build-web]
    if: |
      !cancelled() &&
      needs.build-cli.result == 'success' &&
      needs.build-web.result == 'success' &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
      - name: Download x86_64 CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fieldsmith-x86_64-unknown-linux-musl
          path: release/
      - name: Download aarch64 CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fieldsmith-aarch64-unknown-linux-musl
          path: release/
      - name: Download web archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fieldsmith-web
          path: release/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release/*
      - name: Generate SHA256SUMS
        run: |
          : > SHA256SUMS
          find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.apk' \) | sort | while read -r f; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.apk
            SHA256SUMS
